<!doctype html>
<!-- Template for public/og/<provider>.png. `scripts/og.ts` fills the `{{…}}`
     slots and renders one copy per provider; it is not viewable on its own. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="{{css}}" />
    <style>
      .provider {
        position: absolute;
        left: 88px;
        top: 214px;
        display: flex;
        align-items: center;
        gap: 34px;
      }
      .mark {
        display: grid;
        place-items: center;
        flex: none;
        width: 112px;
        height: 112px;
        border: 1px solid #2a2621;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.03);
        color: #efe8f3;
      }
      .mark svg {
        width: 58px;
        height: 58px;
      }
      .mark .gram {
        font-size: 42px;
        line-height: 1;
      }
      .scope {
        margin: 0 0 6px;
        font-family: "DejaVu Sans Mono", ui-monospace, monospace;
        font-size: 24px;
        color: #8b8274;
      }
      h1 {
        margin: 0;
        font-weight: 400;
        font-size: {{nameSize}}px;
        line-height: 0.98;
        letter-spacing: -0.005em;
      }
      .badge {
        top: 396px;
        margin: 0;
        padding: 9px 18px;
        border: 1px solid #2a2621;
        border-radius: 999px;
        font-size: 18px;
        letter-spacing: 0.1em;
        color: #7f776a;
      }
      .ranked .badge {
        border-color: rgba(255, 122, 158, 0.38);
        background: rgba(255, 122, 158, 0.08);
        color: #ff7a9e;
      }
      /* Zero fixes and Alchemy runs on it. Teal, the colour "used in Alchemy"
         carries on the site, so it reads as its own thing next to the
         brand's amber rather than as more of the same. */
      .honour .badge {
        border-color: rgba(95, 211, 194, 0.45);
        background: rgba(95, 211, 194, 0.12);
        color: #93eadd;
      }
      .honour .mark {
        border-color: rgba(95, 211, 194, 0.35);
        color: #93eadd;
      }
      /* `background-image`, not the shorthand: the shorthand would reset the
         `background-clip: text` the gradient wordmark depends on. */
      .honour .grad {
        background-image: linear-gradient(100deg, #93eadd, #5fd3c2);
      }
      .cmd {
        top: 476px;
      }
      .tags {
        top: 548px;
      }
    </style>
  </head>
  <body class="{{tone}}">
    <div class="brand">
      <svg viewBox="0 0 32 32">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffc384" />
            <stop offset="0.55" stop-color="#f0a35a" />
            <stop offset="1" stop-color="#ff7a9e" />
          </linearGradient>
        </defs>
        <path
          d="M 6.00 6.00 L 12.60 6.00 L 12.60 3.50 L 10.10 3.50 L 10.10 1.00 L 21.90 1.00 L 21.90 3.50 L 19.40 3.50 L 19.40 6.00 L 26.00 6.00 L 26.00 12.60 L 28.50 12.60 L 28.50 10.10 L 31.00 10.10 L 31.00 21.90 L 28.50 21.90 L 28.50 19.40 L 26.00 19.40 L 26.00 26.00 L 19.40 26.00 L 19.40 28.50 L 21.90 28.50 L 21.90 31.00 L 10.10 31.00 L 10.10 28.50 L 12.60 28.50 L 12.60 26.00 L 6.00 26.00 L 6.00 19.40 L 3.50 19.40 L 3.50 21.90 L 1.00 21.90 L 1.00 10.10 L 3.50 10.10 L 3.50 12.60 L 6.00 12.60 Z"
          fill="none"
          stroke="url(#g)"
          stroke-width="1.2"
          stroke-linejoin="miter"
        />
        <circle cx="16" cy="16" r="1.9" fill="#ff7a9e" />
      </svg>
      <span>Distilled</span>
    </div>
    <div class="provider">
      <span class="mark">{{mark}}</span>
      <div>
        <p class="scope">@distilled.cloud/</p>
        <h1><span class="grad">{{name}}</span></h1>
      </div>
    </div>
    <p class="mono badge">{{badge}}</p>
    <p class="mono cmd"><b>$</b>{{install}}</p>
    <p class="mono tags">{{tags}}</p>
    <p class="mono url">distilled.cloud</p>
  </body>
</html>
