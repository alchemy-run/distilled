packages:
  - packages/*
  # Deployment stacks. Not published, not part of `tsc -b` — but members so
  # one `pnpm install` covers them and their versions live in one lockfile.
  - stacks/*
  # Benchmark suites. Not published, not part of `tsc -b`; run with bun.
  - benches/*

allowBuilds:
  msgpackr-extract: true
  # alchemy pulls in miniflare for the Cloudflare state store.
  workerd: true

catalog:
  "@aws-sdk/credential-providers": "^3.0.0"
  "@aws-sdk/types": "^3.973.1"
  "@effect/platform-bun": ">=4.0.0-rc.115 || >=4.0.0"
  "@effect/platform-node": ">=4.0.0-rc.115 || >=4.0.0"
  "@oxc-project/types": "^0.146.0"
  "@smithy/shared-ini-file-loader": "^4.3.4"
  "@smithy/types": "^4.8.1"
  "@smithy/util-base64": "^4.3.0"
  "@types/bun": "1.3.14"
  "@types/node": "26.2.0"
  changelogithub: "^13.16.1"
  dedent: "^1.7.0"
  effect: ">=4.0.0-rc.115 || >=4.0.0"
  fast-xml-parser: "^5.3.4"
  graphql: "^16.9.0"
  husky: "^9.1.7"
  mitata: "^1.0.34"
  oxfmt: "^0.66.0"
  oxlint: "^1.81.0"
  pathe: "^2.0.3"
  rolldown: "1.2.5"
  typescript: "^7.0.2"
  yaml: "^2.6.0"
catalogs:
  # Compatibility line used by the deployment-stack fixtures.
  alchemy:
    "@effect/platform-bun": "4.0.0-rc.112"
    "@effect/platform-node": "4.0.0-rc.112"
    alchemy: "2.0.0-beta.77"
    effect: "4.0.0-rc.112"
minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-rc.115"
  - "@effect/platform-bun@4.0.0-rc.115"
  - "@effect/platform-node-shared@4.0.0-rc.115"
  - "@effect/platform-node@4.0.0-rc.115"
  - "@effect/sql-d1@4.0.0-rc.115"
  - "@effect/sql-mysql2@4.0.0-rc.115"
  - "@effect/sql-pg@4.0.0-rc.115"
  - "@effect/sql-sqlite-do@4.0.0-rc.115"
  - "@effect/vitest@4.0.0-rc.115"
  - effect@4.0.0-rc.115
