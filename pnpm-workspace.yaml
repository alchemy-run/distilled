packages:
  - packages/*
  # Deployment stacks. Not published, not part of `tsc -b` — but members so
  # one `pnpm install` covers them and their versions live in one lockfile.
  - stacks/*
  # Benchmark suites. Not published, not part of `tsc -b`; run with bun.
  - benches/*

allowBuilds:
  msgpackr-extract: true
  # alchemy pulls in miniflare for the Cloudflare state store.
  workerd: true

catalogs:
  bench:
    mitata: ^1.0.34
    rolldown: 1.2.5
  aws:
    "@aws-crypto/crc32": ^5.2.0
    "@aws-crypto/util": ^5.2.0
    "@aws-sdk/credential-providers": ^3.994.0
    "@aws-sdk/types": ^3.973.1
    "@smithy/shared-ini-file-loader": ^4.4.3
    "@smithy/types": ^4.12.0
    "@smithy/util-base64": ^4.3.0
  build:
    typescript: ^7.0.2
  effect:
    "@effect/platform-bun": ">=4.0.0-rc.113 || >=4.0.0"
    effect: ">=4.0.0-rc.113 || >=4.0.0"
  shared:
    fast-xml-parser: ^5.3.4
  tooling:
    "@types/bun": latest
    "@types/node": latest
    dedent: ^1.7.0
    husky: ^9.1.7
    oxfmt: latest
    oxlint: latest
    pathe: ^2.0.3

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-rc.113"
  - "@effect/platform-bun@4.0.0-rc.113"
  - "@effect/platform-node-shared@4.0.0-rc.113"
  - "@effect/platform-node@4.0.0-rc.113"
  - "@effect/sql-d1@4.0.0-rc.113"
  - "@effect/sql-mysql2@4.0.0-rc.113"
  - "@effect/sql-pg@4.0.0-rc.113"
  - "@effect/sql-sqlite-do@4.0.0-rc.113"
  - "@effect/vitest@4.0.0-rc.113"
  - effect@4.0.0-rc.113
