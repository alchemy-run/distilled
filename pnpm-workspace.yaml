packages:
  - packages/*
  # Deployment stacks. Not published, not part of `tsrs -b` — but members so
  # one `pnpm install` covers them and their versions live in one lockfile.
  - stacks/*
  # Benchmark suites. Not published, not part of `tsrs -b`; run with node.
  - benches/*
  # Landing page + Alchemy deploy stack. Private, not in the SDK tsconfig
  # graph; CI typechecks it with `pnpm --filter "./website" run typecheck`.
  - website

allowBuilds:
  msgpackr-extract: true
  # alchemy pulls in miniflare for the Cloudflare state store.
  workerd: true

catalog:
  "@effect/platform-node": "^4.0.5"
  "@oxc-project/types": "^0.153.0"
  "@types/node": "26.6.5"
  "@alchemy.run/cloudflare": "2.0.0-beta.84"
  "@alchemy.run/github": "2.0.0-beta.84"
  alchemy: "2.0.0-beta.84"
  changelogithub: "^13.16.1"
  effect: "^4.0.5"
  graphql: "^16.11.0"
  husky: "^9.1.7"
  mitata: "^1.0.34"
  oxfmt: "^0.72.0"
  oxlint: "^1.87.0"
  rolldown: "1.2.13"
  tsrs: "0.18.0-ts7.1.0-dev.20260929"
  # Only benches/sdks: it measures the consumer typecheck with the compiler SDK users run.
  typescript: "^7.0.2"
  vitest: "^5.0.4"
  yaml: "^2.9.1"

# Benchmark-only (benches/sdks official SDK suite): AWS SDK v3 internals pinned
# to releases older than the minimum release age.
overrides:
  "@aws-sdk/checksums": "3.1001.1"
  "@aws-sdk/core": "3.978.1"
  "@aws-sdk/credential-provider-env": "3.972.72"
  "@aws-sdk/credential-provider-http": "3.972.74"
  "@aws-sdk/credential-provider-ini": "3.973.17"
  "@aws-sdk/credential-provider-login": "3.972.79"
  "@aws-sdk/credential-provider-node": "3.972.84"
  "@aws-sdk/credential-provider-process": "3.972.72"
  "@aws-sdk/credential-provider-sso": "3.973.16"
  "@aws-sdk/credential-provider-web-identity": "3.972.78"
  "@aws-sdk/dynamodb-codec": "3.973.46"
  "@aws-sdk/middleware-endpoint-discovery": "3.972.31"
  "@aws-sdk/middleware-sdk-ec2": "3.972.60"
  "@aws-sdk/middleware-sdk-s3": "3.972.77"
  "@aws-sdk/nested-clients": "3.997.46"
  "@aws-sdk/signature-v4-multi-region": "3.996.47"
  "@aws-sdk/token-providers": "3.1147.0"
