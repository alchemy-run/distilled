name: Website

on:
  # Manual override — deploys unconditionally on whatever branch it's run
  # from. Toggle `prod` to force a production deploy without a release.
  workflow_dispatch:
    inputs:
      prod:
        description: "Deploy to production (distilled.cloud) instead of the branch stage"
        type: boolean
        default: false
  # Release commits (`chore(release):`) bump packages/*/package.json, so
  # production deploys automatically. Other main pushes that touch the site
  # or package manifests deploy staging (main.distilled.cloud).
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "packages/*/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/website.yml"
  pull_request:
    # Label changes create and remove previews without needing another push.
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - closed
    paths:
      - "website/**"
      - "packages/*/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/website.yml"

concurrency:
  group: deploy-website-${{ github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.number) || (inputs.prod ||
    startsWith(github.event.head_commit.message, 'chore(release):')) &&
    'prod' || (github.ref == 'refs/heads/main' && 'main' || github.ref_name)
    }}
  # Deploy and destroy mutate the same stack and must finish atomically. Each
  # run checks the PR's current state before mutation, so queued label events
  # converge to the latest desired state even when GitHub reorders them.
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}',
    github.event.number) || (inputs.prod ||
    startsWith(github.event.head_commit.message, 'chore(release):')) && 'prod' ||
    (github.ref == 'refs/heads/main' && 'main' || github.ref_name) }}

jobs:
  deploy:
    name: Deploy
    # Deploy every qualifying push to main. Release commits
    # (`chore(release): x.y.z`) and dispatches with `prod` toggled deploy
    # production; other main commits deploy to main.distilled.cloud. On PRs,
    # require BOTH:
    #   - the PR is internal (forks can't access bot/Cloudflare secrets
    #     so `create-github-app-token` would error immediately), AND
    #   - the PR carries the `deploy-website` label (opt-in — most PRs
    #     don't need a website preview, so default to skipping).
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'deploy-website') &&
        github.event.action != 'closed' &&
        github.event.action != 'unlabeled' &&
        (github.event.action != 'labeled' ||
         github.event.label.name == 'deploy-website')))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mint a token for the alchemy-version-bot GitHub App so the PR
      # preview comment (created via GitHub.Comment in alchemy.run.ts)
      # posts under the bot's identity instead of `github-actions[bot]`.
      # Same App as release.yml — its installation scopes already cover
      # PR comments.
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - name: Setup pnpm & Bun
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install Node 24
        run: pnpm runtime set node 24 -g

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./website..."

      - name: Check current preview state
        if: github.event_name == 'pull_request'
        id: preview-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.number }}" \
            --jq '[.state == "open", any(.labels[]; .name == "deploy-website")] | all')"
          echo "active=$active" >> "$GITHUB_OUTPUT"

      # Distilled has a single WEBSITE_CLOUDFLARE_* credential set (no
      # PROD_/TEST_ split). STACKS_CLOUDFLARE_* is state-store-only and
      # must not be used here. Generic CLOUDFLARE_* belongs to other tooling.
      - name: Deploy
        if: >-
          github.event_name != 'pull_request' ||
          steps.preview-state.outputs.active == 'true'
        working-directory: website
        run: pnpm exec alchemy deploy --stage "$STAGE" --yes
        env:
          PULL_REQUEST: ${{ github.event.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEBSITE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ZONE_ID }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}

      # PR builds upload zero-traffic versions of this Worker. Refresh the
      # parent from merged main so PR versions have a current parent.
      - name: Deploy preview parent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: website
        run: pnpm exec alchemy deploy --stage preview-base --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEBSITE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ZONE_ID }}
          BUILD_SHA: ${{ github.sha }}

  cleanup:
    name: Cleanup
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'deploy-website')) ||
       (github.event.action == 'unlabeled' &&
        github.event.label.name == 'deploy-website'))
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      - name: Setup pnpm & Bun
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install Node 24
        run: pnpm runtime set node 24 -g

      - name: Install dependencies
        # Destroy evaluates the stack and calls providers; it does not build or
        # bundle anything. Skip native postinstalls and the root prepare build.
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "./website..."

      - name: Check current preview state
        id: preview-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.number }}" \
            --jq '[.state == "open", any(.labels[]; .name == "deploy-website")] | all')"
          echo "active=$active" >> "$GITHUB_OUTPUT"

      # Allowlist, not denylist: cleanup must only ever destroy pr-N stages,
      # so refuse anything else outright (prod/main/preview-base) even if a
      # future STAGE refactor changes what a pull_request event resolves to.
      - name: Safety Check
        if: steps.preview-state.outputs.active != 'true'
        run: |-
          case "${{ env.STAGE }}" in
            pr-[0-9]*) ;;
            *)
              echo "ERROR: cleanup only destroys pr-* stages, got '${{ env.STAGE }}'"
              exit 1
              ;;
          esac

      - name: Destroy Preview Environment
        if: steps.preview-state.outputs.active != 'true'
        working-directory: website
        run: pnpm exec alchemy destroy --stage "$STAGE" --yes
        env:
          PULL_REQUEST: ${{ github.event.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEBSITE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.WEBSITE_CLOUDFLARE_ZONE_ID }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
