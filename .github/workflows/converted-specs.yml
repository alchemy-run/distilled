name: Converted specs

# The converted Smithy models (`packages/*/.generated-specs/`) as a
# downloadable artifact, so checkouts don't have to carry them. Alchemy and
# most SDK work never read them; the ones who do (writing patches, reviewing
# what a spec update changed) fetch them with:
#
#   pnpm specs:converted <pkg>...            # from main's newest run
#   pnpm specs:converted <pkg> --pr 123      # from a PR's newest run
#
# Every push to main converts every package from its spec mirror, as
# `pnpm generate` would, and uploads the result. A PR runs it only when it
# touches what conversion reads: patches, mirror pins, convert scripts or the
# codegen. Artifacts expire after 90 days; a push to main makes a new one.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".gitmodules"
      - "packages/*/specs/**"
      - "packages/*/patches/**"
      - "packages/*/manual-specs/**"
      - "packages/*/scripts/**"
      - "packages/dev/src/codegen/**"
      - "packages/dev/src/json-patch.ts"
      - "scripts/converted-specs.ts"
      - ".github/workflows/converted-specs.yml"
  workflow_dispatch:

concurrency:
  group: converted-specs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  convert:
    name: Convert every spec
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: true
          require-lockfile: true

      # Every mirror at its pinned commit, tip only (about 400 MB).
      - name: Fetch spec mirrors
        run: pnpm specs:sync

      # A package that fails to convert is skipped with a warning; the rest
      # still upload.
      - name: Convert
        run: |
          set +e
          pnpm -r --no-bail --workspace-concurrency=4 --if-present run convert > convert.log 2>&1
          status=$?
          tail -n 40 convert.log
          {
            echo "### Converted specs"
            echo
            echo "$(ls -d packages/*/.generated-specs packages/*/.generated-graphql 2>/dev/null | wc -l) packages have converted models."
            [ "$status" -ne 0 ] && echo "Some packages failed to convert (exit $status); see the job log."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -ne 0 ] && echo "::warning::Some packages failed to convert; see the Convert step log."
          exit 0

      - name: Upload converted specs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converted-specs
          path: |
            packages/*/.generated-specs/
            packages/*/.generated-graphql/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
