name: Spec mirrors

# Every distilled-mirror/spec-mirror-* repository fetches its specs in a
# nightly "Update Specs" run (stacks/distilled-submodules/scaffold/
# update-specs.yml). A failure there stays in the mirror's Actions tab, where
# nobody looks. scripts/spec-mirrors/report-issues.ts keeps one issue here per
# failing mirror: it opens or reopens it, comments only when the failure
# changes, and closes it when the mirror's next nightly run passes.
#
# The mirrors' cron is midnight UTC, but GitHub starts those runs hours late
# (05:00-08:00 UTC is common), so this runs at midday.

on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:

concurrency:
  group: spec-mirrors
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: Report failing spec mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/spec-mirrors
            package.json
            .node-version

      - name: Setup Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      # The mirrors are public, so the built-in token reads their runs.
      - name: Open, update or close the issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/spec-mirrors/report-issues.ts
