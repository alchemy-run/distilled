# Managed by alchemy-run/distilled — stacks/distilled-submodules/scaffold/update-specs.yml.
# Edit it there; a deploy of the `distilled-submodules` stack overwrites this file.

name: Update Specs

on:
  schedule:
    - cron: "0 0 * * *" # every 24 hours at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  # report-issues.ts reads this run's jobs to link the step that failed.
  actions: read

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    env:
      # Written into every mirror by stacks/distilled-monorepo. A mirror
      # without them skips the issue steps below and warns.
      HAS_ISSUE_APP: ${{ secrets.SPEC_MIRROR_APP_CLIENT_ID != '' && secrets.SPEC_MIRROR_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # pnpm comes from `packageManager` in .meta/package.json.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: .meta
          runtime: node@24
          install: false

      # --no-frozen-lockfile: .meta/pnpm-lock.yaml is not managed by the stack,
      # so a repo scaffolded with a new dependency has no lockfile entry for it
      # until the first run commits one, and pnpm freezes the lockfile in CI by
      # default.
      - name: Install dependencies
        working-directory: .meta
        run: pnpm install --no-frozen-lockfile

      # Only spec-mirror-aws holds these secrets: its fetch script reads the
      # EventBridge schema registry, an AWS API. They are minted and written
      # by stacks/distilled-monorepo. Every other mirror sees them empty.
      - name: Fetch specs
        working-directory: .meta
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: pnpm run fetch-specs

      - name: Commit and push if changed
        id: push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: update specs $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # The issues live in alchemy-run/distilled, which this run's
      # GITHUB_TOKEN cannot write. The spec-mirror GitHub App is installed
      # there with Issues: write and nothing else.
      - name: Warn that issue reporting is off
        if: ${{ !cancelled() && env.HAS_ISSUE_APP != 'true' }}
        run: echo "::warning::SPEC_MIRROR_APP_CLIENT_ID or SPEC_MIRROR_APP_PRIVATE_KEY is not set, so this run reports nothing to alchemy-run/distilled. stacks/distilled-monorepo writes both."

      - name: Mint an issue token for alchemy-run/distilled
        id: issue-token
        if: ${{ !cancelled() && env.HAS_ISSUE_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SPEC_MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPEC_MIRROR_APP_PRIVATE_KEY }}
          owner: alchemy-run
          repositories: distilled
          permission-issues: write

      - name: Close a fixed fetch issue
        if: ${{ success() && steps.issue-token.outcome == 'success' }}
        env:
          ISSUES_TOKEN: ${{ steps.issue-token.outputs.token }}
          ISSUES_REPO: alchemy-run/distilled
        run: node .meta/report-issues.ts passed

      - name: Report a spec update
        if: ${{ success() && steps.push.outputs.pushed == 'true' && steps.issue-token.outcome == 'success' }}
        env:
          ISSUES_TOKEN: ${{ steps.issue-token.outputs.token }}
          ISSUES_REPO: alchemy-run/distilled
          COMMIT: ${{ steps.push.outputs.commit }}
        run: node .meta/report-issues.ts updated

      - name: Report a failed fetch
        if: ${{ failure() && steps.issue-token.outcome == 'success' }}
        env:
          ISSUES_TOKEN: ${{ steps.issue-token.outputs.token }}
          ISSUES_REPO: alchemy-run/distilled
          RUN_TOKEN: ${{ github.token }}
        run: node .meta/report-issues.ts failed
